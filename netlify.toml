[build]
  publish = "public"
  # Build de producció: `HUGO_PRODUCTION=1` activa el SEO (meta noindex OFF,
  # description, Open Graph, canonical, schema.org, robots.txt indexable amb
  # bloqueig només als bots d'IA). Sense aquesta variable (staging GH Pages)
  # el site és no-indexable.
  command = "HUGO_PRODUCTION=1 hugo --minify --baseURL https://naubostik.com/"

# Security headers per producció (naubostik.com)
# NOTA: GitHub Pages (staging) NO permet headers personalitzats; aquests apliquen
# només a Netlify. El staging ja protegeix l'indexat via noindex + robots.txt.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
