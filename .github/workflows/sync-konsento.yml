name: Sync dades Konsento

on:
  schedule:
    - cron: '0 * * * *'   # cada hora
  workflow_dispatch:        # execució manual

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch i actualitza dades Konsento
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, sys
          from datetime import datetime, timezone
          from pathlib import Path

          KONSENTO = "https://konsento.naubostik.com"

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "naubostik-web-sync/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"ERROR fetching {url}: {e}", file=sys.stderr)
                  return None

          # ── Assemblees ────────────────────────────────────────────────
          data_a = fetch(f"{KONSENTO}/api/propera-assemblea/")
          if data_a is not None:
              propera = data_a.get("assemblea")
              darrera = data_a.get("darrera")

              lines = ["# Generat automàticament des de Konsento. No editar manualment."]

              if darrera:
                  lines.append("darrera:")
                  lines.append(f"  data: {darrera['data']}")
                  temes = darrera.get("temes") or []
                  if temes:
                      lines.append("  temes:")
                      for t in temes[:6]:
                          safe = t.replace('"', "'")
                          lines.append(f'    - "{safe}"')
                  lines.append(f"  url: {darrera['url']}")
              else:
                  lines.append("darrera: ~")

              lines.append("")

              if propera:
                  dt = datetime.fromisoformat(propera["data"])
                  data_str = dt.strftime("%Y-%m-%d")
                  hora_str = dt.strftime("%H:%M")
                  lines.append("propera:")
                  lines.append(f"  data: {data_str}")
                  lines.append(f'  hora: "{hora_str}"')
                  if propera.get("lloc"):
                      safe_lloc = propera["lloc"].replace('"', "'")
                      lines.append(f'  lloc: "{safe_lloc}"')
                  lines.append(f'  titol: "{propera["titol"].replace(chr(34), chr(39))}"')
                  lines.append(f"  url: {propera['url']}")
                  odl = propera.get("ordre_del_dia") or []
                  if odl:
                      lines.append("  ordre_del_dia:")
                      for punt in odl[:10]:
                          if isinstance(punt, dict):
                              titol = punt.get("titol", "")
                          else:
                              titol = str(punt)
                          if titol:
                              lines.append(f'    - "{titol.replace(chr(34), chr(39))}"')
              else:
                  lines.append("propera: ~")

              Path("data/assemblees.yaml").write_text("\n".join(lines) + "\n", encoding="utf-8")
              print("data/assemblees.yaml actualitzat")

              # ── Activitat per a "Aquesta setmana" ──────────────────────
              act_file = Path("content/activitats/assemblea-konsento.md")
              if propera:
                  dt = datetime.fromisoformat(propera["data"])
                  data_str = dt.strftime("%Y-%m-%d")
                  hora_str = dt.strftime("%H:%M")
                  titol = propera["titol"].replace('"', "'")
                  lloc = (propera.get("lloc") or "").replace('"', "'")
                  url_konsento = propera["url"]
                  contingut = f"""+++
title = "{titol}"
date = {data_str}
hora = "{hora_str}"
assemblea = true
draft = false
descripcio = "Assemblea de la Nau Bostik. <a href=\\"{url_konsento}\\">Veure detalls i confirmar assistència →</a>"
"""
                  if lloc:
                      contingut += f'lloc = "{lloc}"\n'
                  contingut += "+++\n"
                  act_file.write_text(contingut, encoding="utf-8")
                  print("content/activitats/assemblea-konsento.md actualitzat")
              else:
                  if act_file.exists():
                      act_file.unlink()
                      print("assemblea-konsento.md eliminat (no hi ha propera assemblea)")

          # ── Comissions ───────────────────────────────────────────────
          data_c = fetch(f"{KONSENTO}/api/comissions/")
          if data_c is not None:
              comissions = data_c.get("comissions") or []
              lines = ["# Generat automàticament des de Konsento. No editar manualment.", "comissions:"]
              for c in comissions:
                  nom = c["nom"].replace('"', "'")
                  slug = c["slug"]
                  desc = (c.get("descripcio") or "").replace('"', "'")
                  url = c["url"]
                  lines.append(f"  - nom: {nom}")
                  lines.append(f"    slug: {slug}")
                  if desc:
                      lines.append(f'    descripcio: "{desc}"')
                  lines.append(f"    url: {url}")
              Path("data/comissions.yaml").write_text("\n".join(lines) + "\n", encoding="utf-8")
              print("data/comissions.yaml actualitzat")

          print("Sync completat.")
          PYEOF

      - name: Commit si hi ha canvis
        run: |
          git config user.name "Konsento Sync"
          git config user.email "noreply@naubostik.com"
          git add data/assemblees.yaml data/comissions.yaml content/activitats/assemblea-konsento.md 2>/dev/null || true
          git diff --staged --quiet && echo "Sense canvis" || (
            git commit -m "chore: sync dades Konsento $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          )
