name: Sync agenda d'entitats (Konsento)

on:
  schedule:
    - cron: '0 5 * * *'  # cada dia a les 7h Barcelona (5h UTC)
  workflow_dispatch:       # execució manual

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch activitats aprovades de Konsento
        run: python scripts/fetch-agenda-web.py

      - name: Commit fitxers nous
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/activitats-residents/
          git diff --staged --quiet || git commit -m "auto: sync agenda d'entitats des de Konsento"
          git push || true
