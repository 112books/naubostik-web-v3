{{ define "main" }}
<div class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
</div>
<ul class="post-list">
  {{ range .Paginator.Pages }}
    {{ if ne .Kind "section" }}
    <li class="post-card">
      <article>
        <h3><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
        <p class="post-excerpt">{{ .Summary }}</p>
      </article>
    </li>
    {{ end }}
  {{ end }}
</ul>
{{ template "_internal/pagination.html" . }}
{{ end }}
