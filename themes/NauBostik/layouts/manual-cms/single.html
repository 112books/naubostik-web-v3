{{ define "main" }}
<div class="manual-cms">
  <header class="manual-header">
    <h1 class="manual-title">{{ .Title }}</h1>
    {{ with .Description }}<p class="manual-lead">{{ . }}</p>{{ end }}
  </header>

  {{/* Table of Contents - using Hugo's built-in TOC */}}
  <nav class="manual-toc" aria-label="Taula de continguts">
    <h2 class="toc-title">📋 Taula de continguts</h2>
    {{ .TableOfContents }}
  </nav>

  <div class="manual-content content">
    {{ .Content }}
  </div>
</div>

{{/* TOC: desplaçament suau + plegat en mòbil */}}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var toc = document.getElementById('TableOfContents');
    if (!toc) return;

    toc.querySelectorAll('a[href^="#"]').forEach(function (link) {
      link.addEventListener('click', function (e) {
        var id = decodeURIComponent(this.getAttribute('href').slice(1));
        var target = document.getElementById(id);
        if (!target) return;
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.pushState(null, '', '#' + id);
      });
    });

    var tocTitle = document.querySelector('.toc-title');
    var tocRoot = toc.querySelector('ul');
    if (tocTitle && tocRoot) {
      tocTitle.addEventListener('click', function () {
        tocRoot.classList.toggle('is-open');
        tocTitle.classList.toggle('is-open');
      });
    }
  });
</script>
{{ end }}
