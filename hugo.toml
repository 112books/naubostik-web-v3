# El baseURL es passa per entorn (CI/workflow GH Pages) o via flag local.
defaultContentLanguage = 'ca'
theme = "NauBostik"
buildFuture = true
paginate = 8

# robots.txt generat des de plantilla (`layouts/robots.txt`) i meta SEO (baseof.html)
# condicionats a la variable d'entorn `HUGO_PRODUCTION`. Per defecte (staging):
# robots.txt Disallow / i meta noindex a totes les pàgines. Producció (build Netlify
# amb `HUGO_PRODUCTION=1`): indexable, amb bloqueig només als bots d'IA.
#
# NOTA: s'empra variable d'entorn i no `config/<env>/` perquè l'existència d'un
# directori `config/production/` fa que Hugo auto-detecti "production" com a
# environment per defecte i activi el SEO també al staging. La variable d'entorn
# només s'activa al deploy real de producció.
enableRobotsTXT = true

[languages]
  [languages.ca]
    title = 'Nau Bostik'
    languageCode = 'ca'
    languageName = 'Català'
    weight = 1

    [languages.ca.params]
      description = "Nau Bostik. Equipament sociocultural de gestió comunitària situat al barri de La Sagrera."

    [[languages.ca.menu.main]]
      name = "Activitats"
      url = "/activitats/"
      weight = 10

    [[languages.ca.menu.main]]
      name = "Visita la Nau"
      url = "/visita/"
      weight = 20

    [[languages.ca.menu.main]]
      name = "Col·lectius"
      url = "/collectius/"
      weight = 30

    [[languages.ca.menu.main]]
      name = "Espais"
      url = "/espais/"
      weight = 40

    [[languages.ca.menu.main]]
      name = "Qui som"
      url = "/qui-som/"
      weight = 50

    [[languages.ca.menu.main]]
      name = "Notícies"
      url = "/noticies/"
      weight = 60

    [[languages.ca.menu.main]]
      name = "Contacte"
      url = "/contacte/"
      weight = 70

    [[languages.ca.menu.main]]
      name = "Cercar"
      url = "/cercar/"
      weight = 80

ignoreLogs = ['warning-goldmark-raw-html']

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  description = "Nau Bostik. Equipament sociocultural de gestió comunitària situat al barri de La Sagrera."
  # Tira reivindicativa de lemes: mostra-la només a la portada. Desactiva a false.
  showTicker = true
  # Konsento rep els POST dels formularis (proposta d'activitat, contacte).
  konsento_url = "https://konsento.naubostik.com"
  # NOTA: el SEO per producció es controla amb la variable d'entorn HUGO_PRODUCTION
  # (vegeu comentari més amunt), no amb cap paràmetre de config.

