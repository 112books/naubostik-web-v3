<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de continguts — Nau Bostik</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #nc-root { min-height: 100vh; display: flex; flex-direction: column; }

    .cms-footer { text-align: center; padding: 1rem; font-size: 0.75rem; color: #999; border-top: 1px solid #eee; background: #fafafa; margin-top: auto; }
    .cms-footer a { color: #999; text-decoration: none; }
    .cms-footer a:hover { color: #666; }

    .cms-description { text-align: center; padding: 0.75rem 1rem 0; font-size: 0.85rem; color: #666; line-height: 1.4; }

    /* Colors Corporatius Nau Bostik: #c41e3a (vermell) */
    .nc-logo { filter: hue-rotate(0deg); }
    .nc-button-primary, .nc-button-primary:hover { background-color: #c41e3a !important; border-color: #c41e3a !important; }
    .nc-text-primary { color: #c41e3a !important; }
    .nc-border-primary { border-color: #c41e3a !important; }
  </style>
</head>
<body>
  <div id="nc-root"></div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    function injectElements() {
      var root = document.getElementById('nc-root');
      if (!root) return;

      if (!document.getElementById('cms-footer')) {
        var footer = document.createElement('div');
        footer.id = 'cms-footer';
        footer.className = 'cms-footer';
        footer.innerHTML = 'Gestor de continguts de <a href="https://naubostik.com" target="_blank" rel="noopener"><strong>naubostik.com</strong></a> · Powered by <a href="https://linuxbcn.com" target="_blank" rel="noopener">LinuxBCN.com</a>';
        root.appendChild(footer);
      }

      var logo = root.querySelector('.nc-logo');
      if (logo && !document.getElementById('cms-description')) {
        var desc = document.createElement('p');
        desc.id = 'cms-description';
        desc.className = 'cms-description';
        desc.textContent = 'Conviure, crear i cuidar. Espai cultural autogestionat al barri de la Sagrera.';
        logo.parentNode.insertBefore(desc, logo.nextSibling);
      }
    }

    var observer = new MutationObserver(function() { injectElements(); });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
