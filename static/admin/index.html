<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de continguts — Nau Bostik</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #nc-root { min-height: 100vh; }

    .cms-footer { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; font-size: 0.75rem; color: #666; border-top: 1px solid #eee; background: #fafafa; flex-wrap: wrap; gap: 0.5rem; }
    .cms-footer a { color: #c41e3a; text-decoration: none; font-weight: 600; }
    .cms-footer a:hover { text-decoration: underline; }
    .cms-footer .cms-footer__right a { color: #999; font-weight: normal; margin-left: 1rem; }
    .cms-footer .cms-footer__right a:hover { color: #666; }

    .nc-button-primary, .nc-button-primary:hover { background-color: #c41e3a !important; border-color: #c41e3a !important; }
    .nc-text-primary { color: #c41e3a !important; }
    .nc-border-primary { border-color: #c41e3a !important; }
    .nc-text-primary { color: #c41e3a !important; }
    .nc-border-primary { border-color: #c41e3a !important; }
  </style>
</head>
<body>
  <div id="nc-root"></div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    function injectElements() {
      var root = document.getElementById('nc-root');
      if (!root) return;
      if (!document.getElementById('cms-footer')) {
        var footer = document.createElement('div');
        footer.id = 'cms-footer';
        footer.className = 'cms-footer';
        footer.innerHTML = '<div class="cms-footer__left"><a href="/manual-cms/" target="_blank" rel="noopener">📖 Manual d\'Editors</a></div><div class="cms-footer__right"><a href="https://github.com/112books/naubostik-web-v3/issues" target="_blank" rel="noopener">Issues</a><span>Nau Bostik CMS v1.0</span></div>';
        root.appendChild(footer);
      }
    }

    var observer = new MutationObserver(function() { injectElements(); });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
