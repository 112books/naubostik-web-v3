backend:
  name: github
  repo: 112books/naubostik-web-v3
  branch: main
  base_url: https://naubostik-cms-auth.hola-78f.workers.dev
  auth_type: redirect

logo_url: https://112books.github.io/naubostik-web-v3/img/logos/logo-nau-bostik.png

media_folder: "static/img"
public_folder: "/naubostik-web-v3/img"

slug:
  encoding: "unicode"
  clean_replacement: "-"

collections:
  - name: "activitats"
    label: "Activitats"
    folder: "content/activitats"
    create: true
    slug: "{{slug}}"
    sort: { field: "date", order: "DESC" }
    fields:
      - { label: "Titol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Data fi", name: "data_fi", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Hora", name: "hora", widget: "string", required: false }
      - { label: "Hora fi", name: "hora_fi", widget: "string", required: false }
      - { label: "Preu", name: "preu", widget: "string", required: false }
      - { label: "Imatge", name: "imatge", widget: "image", required: false }
      - { label: "Descripcio", name: "descripcio", widget: "text", required: false }
      - { label: "Entitat", name: "entitat", widget: "string", required: false }
      - { label: "Planta", name: "planta", widget: "select", required: false, options: ["Planta Baixa", "Primera planta", "Segona planta", "Terrassa"] }
      - { label: "Enllac extern", name: "link_extern", widget: "string", required: false }
      - { label: "Col-lectiu", name: "collectiu", widget: "string", required: false }
      - { label: "Taller fix", name: "taller_fix", widget: "boolean", default: false }
      - { label: "Assemblea", name: "assemblea", widget: "boolean", default: false }
      - { label: "Comissio", name: "comissio", widget: "boolean", default: false }
      - { label: "Avis", name: "avis", widget: "select", required: false, options: ["tancament", "canvi", "important"] }
      - { label: "Esborrany (No publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Cos", name: "body", widget: "markdown", required: false }

  - name: "activitats-residents"
    label: "Activitats Residents"
    folder: "content/activitats-residents"
    create: true
    slug: "{{slug}}"
    sort: { field: "date", order: "DESC" }
    fields:
      - { label: "Titol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Data fi", name: "data_fi", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Hora", name: "hora", widget: "string", required: false }
      - { label: "Hora fi", name: "hora_fi", widget: "string", required: false }
      - { label: "Preu", name: "preu", widget: "string", required: false }
      - { label: "Imatge", name: "imatge", widget: "image", required: false }
      - { label: "Descripcio", name: "descripcio", widget: "text", required: false }
      - { label: "Entitat", name: "entitat", widget: "string", required: false }
      - { label: "Planta", name: "planta", widget: "select", required: false, options: ["Planta Baixa", "Primera planta", "Segona planta", "Terrassa"] }
      - { label: "Enllac extern", name: "link_extern", widget: "string", required: false }
      - { label: "Col-lectiu", name: "collectiu", widget: "string", required: false }
      - { label: "Esborrany (No publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Cos", name: "body", widget: "markdown", required: false }

  - name: "tallers"
    label: "Tallers"
    folder: "content/tallers"
    create: true
    slug: "{{slug}}"
    sort: { field: "date", order: "DESC" }
    fields:
      - { label: "Titol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Imatge principal", name: "imatge", widget: "image", required: false }
      - label: "Mes imatges"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Imatge", name: "imatge", widget: "image" }
      - { label: "Descripcio", name: "descripcio", widget: "text", required: false }
      - { label: "Espai", name: "espai", widget: "string", required: false }
      - { label: "Responsable", name: "responsable", widget: "string", required: false }
      - { label: "Horari", name: "horari", widget: "string", required: false }
      - { label: "Mes informacio (URL externa)", name: "link", widget: "string", required: false }
      - { label: "Esborrany (No publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Cos", name: "body", widget: "markdown", required: false }

  - name: "collectius"
    label: "Col·lectius"
    folder: "content/collectius"
    create: true
    slug: "{{slug}}"
    sort: { field: "date", order: "DESC" }
    fields:
      - { label: "Titol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Esborrany (No publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Logo", name: "logo", widget: "image", required: false }
      - { label: "Ambit", name: "ambit", widget: "select", multiple: true, required: false, options: ["tecnologia", "fotografia", "educacio", "musica", "art", "teatre", "dansa", "gastronomia", "economia-social", "habitatge", "activisme", "editorial", "infancia"] }
      - { label: "Web", name: "web", widget: "string", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Descripcio", name: "descripcio", widget: "text" }
      - { label: "Cos", name: "body", widget: "markdown", required: false }

  - name: "espais"
    label: "Espais"
    folder: "content/espais"
    create: true
    slug: "{{slug}}"
    sort: { field: "date", order: "DESC" }
    fields:
      - { label: "Titol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Ubicacio", name: "ubicacio", widget: "select", options: ["Planta baixa", "Primera planta", "Segona planta", "Terrassa", "Exterior"] }
      - { label: "Cedible", name: "cedible", widget: "boolean", default: false }
      - { label: "Esborrany (No publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Fotografies", name: "fotografies", widget: "list", required: false, field: { label: "Imatge", name: "imatge", widget: "image" } }
      - { label: "Plaanol", name: "plano", widget: "image", required: false }
      - { label: "Logo", name: "logo", widget: "image", required: false }
      - { label: "Col-lectiu", name: "collectiu", widget: "string", required: false }
      - { label: "Mail", name: "mail", widget: "string", required: false }
      - { label: "Web", name: "web", widget: "string", required: false }
      - { label: "Xarxes", name: "xarxes", widget: "list", required: false, fields:
          [
            { label: "Nom", name: "nom", widget: "string" },
            { label: "URL", name: "url", widget: "string" },
          ] }
      - { label: "Cos", name: "body", widget: "markdown", required: false }

  - name: "noticies"
    label: "Noticies"
    folder: "content/noticies"
    create: true
    slug: "{{slug}}"
    sort: { field: "date", order: "DESC" }
    fields:
      - { label: "Titol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Imatge", name: "imatge", widget: "image", required: false }
      - { label: "Destacada", name: "destacada", widget: "boolean", default: false }
      - { label: "Esborrany (No publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Cos", name: "body", widget: "markdown", required: false }

  - name: "recinte"
    label: "Estat de la Nau Bostik"
    description: "Configura l'estat del recinte i avisos. El camp 'Nota' apareix al hero de la portada. Els 'Avisos' es mostren a la pàgina d'inici i a l'agenda."
    files:
      - name: "recinte"
        label: "Estat de la Nau Bostik"
        file: "data/recinte.yaml"
        fields:
          - { label: "Estat", name: "estat", widget: "select", options: ["obert", "tancat", "parcial"], required: true }
          - { label: "Nota (text visible al hero)", name: "nota", widget: "string", required: false }
          - label: "Avisos"
            name: "avisos"
            widget: "list"
            required: false
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Tipus", name: "tipus", widget: "select", options: ["tancament", "campanya", "info"] }

  - name: "slogans"
    label: "Slogans / Frases del ticker"
    description: "Frases que rolen al ticker de la portada (hero). Una per línia, s'alternen automàticament."
    files:
      - name: "slogans"
        label: "Llista de slogans"
        file: "data/slogans.yaml"
        fields:
          - { label: "Slogans", name: "slogans", widget: "list", required: false }

  - name: "hero-slideshow"
    label: "Hero Slideshow (Portada)"
    description: "Imatges de fons del carrusel principal de la portada. L'ordre = ordre visual. Recomanat: 1920x1080px. Opcional: URL per fer clicable la imatge."
    files:
      - name: "hero-slideshow"
        label: "Imatges del Hero"
        file: "data/hero-slideshow.yaml"
        fields:
          - label: "Imatges del carrusel"
            name: "images"
            widget: "list"
            fields:
              - { label: "Imatge (1920x1080px recomanat)", name: "src", widget: "image" }
              - { label: "Text alternatiu (accessibilitat)", name: "alt", widget: "string" }
              - { label: "Enllaç opcional (URL absoluta)", name: "link", widget: "string", required: false }

  - name: "portada"
    label: "Portada"
    files:
      - name: "portada"
        label: "Recursos de portada"
        file: "data/portada.yaml"
        fields:
          - label: "Recursos"
            name: "recursos"
            widget: "list"
            required: false
            fields:
              - { label: "Titol", name: "titol", widget: "string" }
              - { label: "Descripcio", name: "descripcio", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Tipus", name: "tipus", widget: "string" }

  - name: "equip"
    label: "Equip"
    files:
      - name: "equip"
        label: "Membres de l'equip"
        file: "data/equip.yaml"
        fields:
          - label: "Equip Gestor"
            name: "treballadors"
            widget: "list"
            fields:
              - { label: "Nom", name: "nom", widget: "string" }
              - { label: "Rol", name: "rol", widget: "string" }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Foto (300x300 o 600x600 px)", name: "foto", widget: "image", required: false }
          - label: "Colaboradors"
            name: "colaboradors"
            widget: "list"
            required: false
            fields:
              - { label: "Nom", name: "nom", widget: "string" }
              - { label: "Rol", name: "rol", widget: "string" }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Foto (300x300 o 600x600 px)", name: "foto", widget: "image", required: false }

  - name: "sources"
    label: "Fonts RSS"
    files:
      - name: "sources"
        label: "Fonts de notícies del territori"
        file: "data/sources.yaml"
        fields:
          - label: "Fonts"
            name: "sources"
            widget: "list"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "URL RSS", name: "url", widget: "string" }
              - { label: "Activa", name: "active", widget: "boolean", default: true }